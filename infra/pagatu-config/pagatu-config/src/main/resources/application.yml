server:
  port: 18888

spring:
  application:
    name: pagatu-config
  cloud:
    config:
      server:
        git:
          uri: https://github.com/EdgarKbana/Desarrollo-de-Aplicaciones
          default-label: master

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always